<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fuel Log">
<meta name="theme-color" content="#0E7A57">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Fuel Log</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
<style>
body{padding-top:env(safe-area-inset-top)}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login input{width:100%}
.tab[hidden]{display:none!important}
/* Layout: phone-first single column, one big "remaining" gauge, meal groups below, tab bar pinned to the bottom */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#16211C; --muted:#5D6B64; --line:#D8E0DB;
  --accent:#0E7A57; --accent-ink:#FFFFFF; --accent-soft:#D6EDE3;
  --warn:#B86A00; --over:#C2362B; --over-soft:#F8DEDA;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#18221D; --ink:#E6EEE9; --muted:#97A69E; --line:#2A3731;
  --accent:#3DBB8D; --accent-ink:#06140E; --accent-soft:#183A2D;
  --warn:#E5A341; --over:#F06A5C; --over-soft:#3E1F1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221D; --ink:#E6EEE9; --muted:#97A69E; --line:#2A3731;
  --accent:#3DBB8D; --accent-ink:#06140E; --accent-soft:#183A2D;
  --warn:#E5A341; --over:#F06A5C; --over-soft:#3E1F1B; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn.danger{background:var(--over);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:120px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}

/* Day header */
.dayhead{display:flex;align-items:center;gap:10px}
.dayhead .title{flex:1;min-width:0}
.dayhead .sub{font-size:.9rem}

/* Gauge */
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .centre{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.gstats{display:flex;flex-direction:column;gap:10px}
.gstats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.gstats div:last-child{border:0;padding:0}
.targetbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media (max-width:380px){.gauge{grid-template-columns:1fr;justify-items:center}.gstats{width:100%}}

/* Meals */
.meal{display:flex;flex-direction:column;gap:6px}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item .name{flex:1;min-width:0;overflow-wrap:anywhere}
.item .amt{font-size:.85rem;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}

/* History */
.hist .item .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.hist .item .bar i{display:block;height:100%;background:var(--accent)}
.hist .item .bar i.over{background:var(--over)}
.pill{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.over{background:var(--over-soft);color:var(--over)}

/* Ask */
.answer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:60px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.9rem}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
details summary{font-family:var(--display);font-weight:700;cursor:pointer}
details[open] summary{margin-bottom:10px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.preview{display:flex;justify-content:space-between;align-items:baseline;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.preview .num{font-size:1.4rem;color:var(--accent)}
/* Plan */
.planday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.planday.past{opacity:.6}
details.planday{padding:0}
details.planday>summary{list-style:none;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
details.planday>summary::-webkit-details-marker{display:none}
details.planday>summary::after{content:"▾";position:absolute;right:14px;top:12px;color:var(--muted);transition:transform .15s}
details.planday{position:relative}
details.planday[open]>summary::after{transform:rotate(180deg)}
details.planday[open]>summary{padding-bottom:4px}
details.planday .pdbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.pdsum{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px;font-family:var(--body,inherit);font-weight:500}
details.planday .pdhead{padding-right:22px}
details.earlierdays{background:none;border:1px dashed var(--line)}
.quickadd{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.swipewrap{position:relative;overflow:hidden}
.swipewrap:not(:last-child){border-bottom:1px solid var(--line)}
.swipewrap .swipebg{position:absolute;inset:0;background:var(--over,#c0392b);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;visibility:hidden}
.swipewrap.swiping .swipebg{visibility:visible}
.swipewrap>.item{position:relative;transition:transform .2s;touch-action:pan-y;background:var(--surface);border-bottom:0}
.shopmode{display:flex;flex-direction:column;gap:14px}
.shopmode .item.check{padding:14px 12px;font-size:1.15rem}
.shopmode .item.check input[type=checkbox]{width:32px;height:32px;flex:none}
.shopmode .item.check .amt{display:none}
.shopmode .xbtn{display:none}
details.earlier{padding:0;background:none;border:0}
details.earlier summary{padding:10px 4px;color:var(--muted)}
.earlierlist{display:flex;flex-direction:column;gap:18px}
.planday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pdhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem}
.pdhead .num{font-size:.8rem}
.pslot{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:start}
.pslot .label{padding-top:8px}
.padd{min-width:34px}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--line);border-radius:6px;padding:1px 5px;vertical-align:1px}
.tag.who{color:var(--accent);background:var(--accent-soft)}
.tag.fresh{color:var(--warn);background:transparent;border:1px solid currentColor}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.planrow{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.planrow:last-child{border-bottom:0}
.planrow.today{background:var(--accent-soft)}
.pday{display:flex;flex-direction:column;width:38px;flex:none;line-height:1.2}
.pmeals{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.pchip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.9rem;text-align:left;overflow-wrap:anywhere}
.pchip .num{color:var(--muted);font-size:.8rem;margin-left:4px}
.padd{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:6px 10px;font-size:.9rem;color:var(--accent);font-weight:600}
.item{box-sizing:border-box}
.item.check{cursor:pointer}
.item.check input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.item.check input:checked+.name{}
.donehead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.donehead~.item.check .name,.basket .name{text-decoration:line-through;color:var(--muted)}
.qty{font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:nowrap;flex:none;max-width:45%;overflow-wrap:anywhere;white-space:normal;text-align:right}
.xbtn{border:0;background:none;color:var(--muted);font-size:1rem;padding:4px 6px}
details.need{padding:0;overflow:hidden}
details.need summary{padding:14px}
details.need[open] summary{margin:0;border-bottom:1px solid var(--line)}
details.need .item{border-left:0;border-right:0}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.rstats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.big2{font-size:1.3rem;font-weight:600}
.ings,.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet h3{font-size:1.05rem;margin-top:4px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-sizing:border-box}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
.notice{background:var(--over-soft);color:var(--over);border-radius:12px;padding:12px 14px;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <p class="muted">Loading your log…</p>
</div>

<nav class="tabs" aria-label="Sections">
  <button class="tab" data-tab="day" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Day</button>
  <button class="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button class="tab" data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11h11.2L21 8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Shop</button>
  <button class="tab" data-tab="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Recipes</button>
  <button class="tab" data-tab="foods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Meals</button>
  <button class="tab" data-tab="people" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="peoplelabel">Family</span></button>
  <button class="tab" data-tab="ask" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>Ask</button>
</nav>
<div id="overlay"></div>

<script>
(function(){
const MEALS=["Breakfast","Lunch","Tea","Snacks"];
const ADJ="Adjustment";
const S={settings:{target:null},foods:[],lib:[],libDocs:{},plan:"",days:{},recipes:[],recipeDocs:{},plans:{}};
let planOpen=new Set(), planPastOpen=false, shopMode=false;
let ingsOpen=false, shopMealsOpen=false, showEarlier=false, planWeek=null, openShop=new Set(), recipeQuery="";
let col=null, store="none", sample=null, sampleImages=false;
const SUPA_URL="https://vjngnnhvkhzzzdvqeqlw.supabase.co", SUPA_KEY="sb_publishable_81DO0yFERJpLcuSxqXcLeA_y6bLUixn";
const sb=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let ME=null, PROFILE=null;
/* where each document lives: shared library (everyone), household (you and C), or just you */
function scopeOf(id){
  if(id==="foods"||id.startsWith("foodlib-")||id==="recipes"||id.startsWith("recipes-")) return "lib";
  if(id.startsWith("plan-")||id==="shop"||id==="freezer"||id==="plan") return "h:"+PROFILE.household_id;
  return "u:"+ME.id}
let tab="day", curDate=todayKey(), foodQuery="", lastAnswer="", asking=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const fmt=n=>Math.round(n).toLocaleString("en-GB");
function todayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function keyToDate(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function shift(k,n){const d=keyToDate(k);d.setDate(d.getDate()+n);return todayKey(d)}
function niceDate(k){const d=keyToDate(k);return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}
function shortDate(k){const d=keyToDate(k);return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function dayItems(k){return (S.days[k]&&S.days[k].items)||[]}
function eaten(k){return dayItems(k).reduce((a,i)=>a+(+i.kcal||0),0)}
/* protein: foods store grams on the same basis as kcal (per item, or per 100g/100ml) */
function protFor(f,amt){if(!f||f.protein==null)return null;return f.basis==="item"?f.protein*amt:f.protein*amt/100}
function compProt(c,byId){const f=c.foodId&&byId[c.foodId];if(f)return protFor(f,c.amount)||0;return c.amount*(+c.proteinPerUnit||0)}
function foodProt(f){if(!f)return null;if(f.protein!=null)return f.protein;if(f.components){const byId=Object.fromEntries(allFoods().map(x=>[x.id,x]));return f.components.reduce((a,c)=>a+compProt(c,byId),0)}return null}
function itemProt(i,byId){if(i.protein!=null)return +i.protein;const f=byId&&byId[i.foodId];if(!f)return null;
  const p=foodProt(f);if(p==null)return null;
  if(typeof i.amount==="number"||(i.amount!==""&&!isNaN(+i.amount)&&!f.components))return f.components?p:protFor({...f,protein:p},+i.amount);
  return f.kcal?p*(i.kcal/f.kcal):p}
function protTotal(items){const byId=Object.fromEntries(allFoods().map(f=>[f.id,f]));let t=0,unknown=0;items.forEach(i=>{const p=itemProt(i,byId);if(p==null)unknown++;else t+=p});return {g:t,unknown}}
function unitOf(f){return f.basis==="100ml"?"ml":f.basis==="item"?(f.itemName||"item"):"g"}
function kcalFor(f,amt){return f.basis==="item"?f.kcal*amt:f.kcal*amt/100}
function basisText(f){return f.basis==="item"?`${fmt(f.kcal)} kcal per ${esc(f.itemName||"item")}`:`${fmt(f.kcal)} kcal per ${f.basis==="100ml"?"100 ml":"100 g"}`}

/* ---------- storage ---------- */
const queues={};
function save(id,data){
  if(store==="db"){
    const row={scope:scopeOf(id),doc_id:id,data:flipPlan(id,JSON.parse(JSON.stringify(data))),updated_at:new Date().toISOString(),updated_by:ME.id};
    queues[id]=(queues[id]||Promise.resolve()).then(async()=>{const {error}=await sb.from("docs").upsert(row);if(error)throw error}).catch(e=>toast("Couldn't save: "+(e&&e.message||"try again")));
  }else if(store==="local"){
    try{localStorage.setItem("fuel:"+id,JSON.stringify(data))}catch(e){}
  }
}
function remove(id){ if(store==="db") sb.from("docs").delete().eq("scope",scopeOf(id)).eq("doc_id",id).then(()=>{}); else try{localStorage.removeItem("fuel:"+id)}catch(e){} }
function ingest(id,d){
  if(!d) return;
  d=JSON.parse(JSON.stringify(d)); /* snapshots arrive frozen; keep our own editable copy */
  if(id==="settings") S.settings=Object.assign({target:null},d);
  else if(id==="foods") S.foods=Array.isArray(d.list)?d.list:[];

const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SLOTS=["Breakfast","Mid-morning","Lunch","Afternoon","Tea"];
/* plan slots map onto the day log's meals */
const slotMeal=s=>s==="Mid-morning"||s==="Afternoon"?"Snacks":s;
const itemSlot=x=>x.label||x.meal;
/* fill a school day's empty slots in the plan from the term-time routine (once per day) */
function prefillPlan(w){
  const p=planOf(w); p.routineDone=p.routineDone||{}; let changed=false;
  weekDays(w).forEach(d=>{
    if(p.routineDone[d]||d<todayKey()||!routineDay(d)) return;
    const v=daySlots(p,d);
    routine().items.forEach(x=>{const sl=itemSlot(x);if(SLOTS.includes(sl)&&!v[sl].filter(countsForMe).length&&plannable(x.foodId)){v[sl].push({id:x.foodId,routine:true,who:"me"});}});
    p.routineDone[d]=true;changed=true;});
  if(changed) savePlan(w);
}
const dowOf=d=>(keyToDate(d).getDay()+6)%7;

const SECTIONS=["Fruit & veg","Refrigerator","Dried food","Frozen","Cleaning","Other"];

  if(/unblock|drain|descal|oven clean|polish|air freshener/.test(t)) return "Cleaning";
  if(/biscoff|biscuit|crisps|cereal|crackers|crispbread/.test(t)) return "Dried food";

  if(/\btins?\b|tinned|\bcans?\b|\bjar\b|paste|pur[eé]e|dried|powder|flakes|ground|sauce|stock|granules|seeds|\boil\b|vinegar|flour|cornflour|\brice\b|pasta|spaghetti|fusilli|linguine|orzo|noodles|lentils|split peas|chickpeas|butter beans|kidney beans|pinto|baked beans|passata|sugar|honey|syrup|coconut milk|black pepper|\bsalt\b|spice|cumin|paprika|turmeric|garam|curry|cinnamon|oregano|thyme leaves|stock cube|oats|whey|protein powder|bagel|bread|wrap|tortilla|rolls?\b|bun|crouton|couscous|cocoa|chocolate|jam|ketchup|mustard|mayo|worcester|soy|hoisin|oyster|sriracha|gochujang|harissa|pesto|sun ?dried|wine|port\b|cereal|biscuit|crisps|nuts|peanut butter|tahini|raisins|sultanas|desiccated|cardamom|food colouring|ras el hanout|brandy|whisk|seasoning|mirin|vanilla|extract|pickle|capers|olives/.test(t)) return "Dried food";
  if(/\bpeas\b|edamame/.test(t)) return "Frozen";
  if(/chicken|beef|pork|lamb|mince|sausage|bacon|\bham\b|chorizo|prosciutto|duck|steak|brisket|ribs|fish|\bcod\b|prawn|salmon|milk|cream|cr[eè]me|yog(h)?urt|cheese|cheddar|feta|halloumi|mozzarella|stilton|parmesan|butter|\beggs?\b|gnocchi|pouch|houmous|hummus|coleslaw/.test(t)) return "Refrigerator";
  if(/onion|garlic|carrot|potato|pepper|chilli|ginger|lemon|lime|orange|apple|banana|pear|pineapple|tomato|mushroom|spinach|salad|lettuce|rocket|coriander|basil|parsley|mint|dill|chives|thyme|rosemary|spring onion|leek|celery|courgette|broccoli|cauliflower|pak choi|mangetout|sugar snap|beansprout|cabbage|kale|squash|aubergine|avocado|cucumber|sweetcorn|corn on|herbs|lemongrass|fruit|berr|grape|melon|sage|jalape|shallot|watercress|plum|apricot|mango|berries|beans, trimmed|swede|parsnip|beetroot|radish|green beans/.test(t)) return "Fruit & veg";

/* ---- what goes on the shopping list: you choose per ingredient; things you usually have in stock are remembered ---- */
const pantry=()=>new Set(S.settings.pantry||[]);
function needs(p,i){const v=p.need[i.key];return v!==undefined?v:!pantry().has(nameKey(i.item))}
/* ---------- portions: leftovers go to another day or the freezer; freezer meals cost nothing on the shopping list ---------- */
const eatersOf=who=>who==="both"?2:1;
function freezer(){return S.freezer||[]}

function freezerAdd(id,n){S.freezer=freezer().slice();const ex=S.freezer.find(x=>x.id===id);if(ex)ex.portions+=n;else S.freezer.push({id,portions:n,added:todayKey()});saveFreezer()}
function freezerTake(id,n){S.freezer=freezer().map(x=>x.id===id?{...x,portions:x.portions-n}:x).filter(x=>x.portions>0);saveFreezer()}
function portionsPopup(day,slot,id,who,made){

      <div class="seg" id="pwho" style="margin-top:6px">${[["me","Me"],["both","Both"],["wife",partnerName()]].map(([k,l])=>`<button type="button" data-who="${k}" aria-pressed="${k===who}">${esc(l)}</button>`).join("")}</div>

    sh.querySelector("#pwho").onclick=e=>{const b=e.target.closest("button");if(!b)return;pwho=b.dataset.who;sh.querySelectorAll("#pwho button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))};
    sh.querySelector("#pdays").onclick=e=>{const b=e.target.closest("[data-d]");if(!b||left<=0)return;const d=b.dataset.d,wk=weekStart(d),p=planOf(wk);
      daySlots(p,d)[pslot].push({id,who:pwho,left:true});savePlan(wk);left-=eatersOf(pwho);b.setAttribute("aria-pressed","true");
      toast(`Leftovers added to ${DOW[dowOf(d)]} ${pslot.toLowerCase()}`);draw(sh);if(left<=0)setTimeout(closeSheet,600)};
    sh.querySelector("#pfreeze").onclick=()=>{if(left<=0)return;freezerAdd(id,left);toast(`${left} portion${left===1?"":"s"} in the freezer`);closeSheet()};

/* ---------- add a meal: choose days and (for recipes) how many portions to make ---------- */
function scaleQty(q,f){if(!q||f===1)return cleanQty(q);const p=parseQty(q);if(!p)return cleanQty(q)+(f!==1?` ×${+f.toFixed(2)}`:"");
  return p.u?fmtQty(p.n*f,p.u):String(Math.ceil(p.n*f*2)/2)}
/* ---------- extras on a planned meal (rice, garlic bread, a side salad…): per person, add to your calories and the shopping list ---------- */
function exFood(x){return x.foodId&&allFoods().find(f=>f.id===x.foodId)}
const exKcal=x=>{const f=exFood(x);return f?kcalFor(f,+x.amount||0):0};
const exProt=x=>{const f=exFood(x);return f?(protFor(f,+x.amount||0)||0):0};
const extrasKcal=e=>(e.extras||[]).reduce((a,x)=>a+(x.shopOnly?0:exKcal(x)),0);
/* "serve with…" in a recipe's method or note → suggested extras */
const SIDE_WORDS=["halloumi","chicken thigh","rice","pitta","naan","flatbread","garlic bread","crusty bread","ciabatta","salad","couscous","mash","new potatoes","chips","wedges","tortilla","wraps","green beans","broccoli","peas","yoghurt","yogurt","sour cream","soured cream","creme fraiche","crème fraîche","cheese","avocado","noodles","quinoa","jacket potato"];
function sideSuggest(id){const r=recipeById(id);if(!r)return [];
  const t=((r.method||[]).join(" ")+" "+(r.note||"")).toLowerCase(), m=t.match(/serve[sd]?\b[^.]*|with\b[^.]*(on the side|alongside)/g); if(!m) return [];
  const txt=m.join(" "), used=new Set((r.ingredients||[]).map(g=>nameKey(g.item||""))), out=[];
  const ALIAS={rice:"basmati / white rice (cooked)",chips:"oven chips",mash:"potatoes (boiled)",salad:"mixed salad",flatbread:"naan",yoghurt:"greek yogurt",yogurt:"greek yogurt",noodles:"noodles (cooked)",couscous:"couscous (cooked)"};
  SIDE_WORDS.forEach(w=>{if(!new RegExp("\\b"+w).test(txt)||used.has(nameKey(w)))return;const q=ALIAS[w]||w;const hit=allFoods().filter(f=>f.kind!=="recipe").find(f=>f.name.toLowerCase()===q)?{f:allFoods().find(f=>f.kind!=="recipe"&&f.name.toLowerCase()===q)}:searchFoods(q).find(x=>!x.quick&&x.f.kind!=="recipe");if(hit&&!out.some(o=>o.id===hit.f.id))out.push(hit.f)});
  return out.slice(0,6)}
/* ---------- camera: read a nutrition label (and the front of the pack) with Claude ---------- */
async function readLabel(files){
  const r=await sample.json(`Read these food packaging photos (a nutrition panel, and maybe the front of the pack). Return JSON only:
{"name": brand and product name if visible (e.g. "Kellogg's Rice Krispies Scares caramel & chocolate"), else "",
 "per100": {"basis": "100g" or "100ml", "kcal": number, "protein": number} or null if there is no per-100 column,
 "serving": {"size": the serving size text e.g. "36g" or "1 bar", "itemName": one short word for a serving e.g. "bar","pot","pack","slice","biscuit","portion", "kcal": number, "protein": number} or null if there is no per-serving/per-item column}
Use kcal, not kJ. Read the numbers carefully from the table; do not guess.`,{images:[...files],modelTier:"quick"});
  return r||{};
}
/* a food from a read label: per item if the label gives one (a bar, a pot), otherwise per 100g/ml */
function foodFromLabel(r,fallbackName){
  const name=(r.name||fallbackName||"Scanned food").trim(), sv=r.serving, p=r.per100;
  let f=null;
  if(sv&&+sv.kcal){f={basis:"item",itemName:(sv.itemName||"serving").toLowerCase(),kcal:Math.round(+sv.kcal),protein:sv.protein!=null?Math.round(+sv.protein*10)/10:undefined,
    name:name+(sv.size&&!/^1\s/.test(sv.size)?` (${sv.size})`:""),shop:p&&+p.kcal?`From the label – ${Math.round(+p.kcal)} kcal/${p.basis==="100ml"?"100ml":"100g"}`:"From the label"}}
  else if(p&&+p.kcal){f={basis:p.basis==="100ml"?"100ml":"100g",itemName:"",kcal:Math.round(+p.kcal*10)/10,protein:p.protein!=null?Math.round(+p.protein*10)/10:undefined,name,shop:"From the label"}}
  if(!f) return null;
  if(f.protein===undefined) delete f.protein;
  return {id:uid(),kind:f.basis==="item"?"meal":"ingredient",...f};
}

/* pack size from the food's name or source line, e.g. "pack 2.5kg" -> 2500 (grams or ml) */
function packSize(f){const t=((f&&f.name)||"")+" "+((f&&f.shop)||"");const m=t.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|litres?|l)\b/i);if(!m)return 0;let n=parseFloat(m[1]);const u=m[2].toLowerCase();if(u==="kg"||u.startsWith("l"))n*=1000;return n}

/* fill empty slots: usual breakfast/lunch every day; teas cooked in pairs (Mon+Tue, Wed+Thu, Fri+Sat, Sun) */
function suggestWeek(){
  const w=planWeek, p=planOf(w), days=weekDays(w);
  const bf=S.foods.find(f=>f.id==="meal-usual-breakfast"), ln=S.foods.find(f=>f.id==="meal-usual-lunch");
  let filled=0;
  days.forEach(d=>{const v=daySlots(p,d);if(bf&&!v.Breakfast.length){v.Breakfast.push({id:bf.id});filled++}if(ln&&!v.Lunch.length){v.Lunch.push({id:ln.id});filled++}});
  /* tea budget: daily target minus everything else planned that day, roughly */
  const usual=(bf?bf.kcal:0)+(ln?ln.kcal:0)+S.foods.filter(f=>["aldi-strawberry-pouch","meal-double-shake"].includes(f.id)).reduce((a,f)=>a+f.kcal,0);
  const budget=S.settings.target?Math.max(350,S.settings.target-usual):600;
  const used=new Set();
  [shift(w,-7)].forEach(pw=>{const pp=S.plans[pw];if(pp)Object.values(pp.days).forEach(v=>{(Array.isArray(v)?v:(v.Tea||[])).forEach(e=>used.add(typeof e==="string"?e:e.id))})});
  days.forEach(d=>daySlots(p,d).Tea.forEach(e=>used.add(e.id)));
  let pool=S.recipes.filter(r=>isPrep(r)&&r.kcal<=budget&&!used.has(r.id));
  if(pool.length<4) pool=S.recipes.filter(r=>isPrep(r)&&!used.has(r.id));
  pool=pool.map(r=>({r,k:Math.random()})).sort((a,b)=>a.k-b.k).map(x=>x.r);
  const pairs=[[0,1],[2,3],[4,5],[6]].filter(g=>g.every(i=>!daySlots(p,days[i]).Tea.length));
  const picks=[];
  for(const r of pool){ if(picks.length>=pairs.length)break; const t=proteinOf(r); if(picks.some(x=>proteinOf(x)===t)&&pool.length>pairs.length*2)continue; picks.push(r) }
  /* most perishable first; recipes sharing a short-life ingredient sit next to each other */
  picks.sort((a,b)=>recipePerish(b)-recipePerish(a));
  for(let i=1;i<picks.length-1;i++){const prev=new Set(perishItems(picks[i-1]));const j=picks.findIndex((x,k)=>k>i&&perishItems(x).some(it=>prev.has(it)));if(j>i){const t=picks[i];picks[i]=picks[j];picks[j]=t}}
  pairs.forEach((g,n)=>{const r=picks[n];if(!r)return;g.forEach((i,k)=>{daySlots(p,days[i]).Tea.push(k?{id:r.id,left:true,who:"both"}:{id:r.id,who:"both"});filled++})});
  savePlan(w);render();
  toast(filled?"Week filled in. Tap any meal to swap it.":"Nothing to fill: every slot already has a meal.");
}

/* ---------- type-ahead search across everything you can log ---------- */
function searchFoods(q){
  /* forgiving match: "nandos" finds "Nando's", "half" finds "½", "&" = "and" */
  const nz=t=>t.toLowerCase().replace(/½/g," half ").replace(/¼/g," quarter ").replace(/\b1\/2\b/g," half ").replace(/\b1\/4\b/g," quarter ").replace(/&/g," and ").replace(/['’`]/g,"").replace(/[–—-]/g," ").replace(/\s+/g," ").trim();
  q=nz(q); if(!q) return [];
  const words=q.split(/\s+/);
  const pool=allFoods().map(f=>({f,type:f.kind==="recipe"?"Recipe":isMeal(f)?(isDb(f)?"Food":"My meal"):"Ingredient"}));
  /* things you've typed in by hand before */
  const seen=new Set(allFoods().map(f=>f.name.toLowerCase()));
  Object.keys(S.days).sort().reverse().forEach(d=>dayItems(d).forEach(i=>{if(!i.foodId&&i.name&&!seen.has(i.name.toLowerCase())){seen.add(i.name.toLowerCase());pool.push({f:{id:"q:"+i.name,name:i.name,kcal:i.kcal,basis:"item",itemName:"portion"},type:"Logged before",quick:true})}}));
  return pool.map(x=>{const n=nz(x.f.name);let sc=0;
      if(n.startsWith(q))sc=100;else if(n.split(/[\s(]+/).some(w=>w.startsWith(words[0])))sc=60;
      if(words.every(w=>n.includes(w)))sc+=30;else sc=0;
      return {...x,sc};}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||a.f.name.length-b.f.name.length).slice(0,10);
}

The person's saved ingredients (use one when it matches, and give its id):
${ings||"(none)"}

function inHoliday(k,r){return (r.holidays||[]).some(h=>h.from&&h.to&&k>=h.from&&k<=h.to)}

/* meals planned for you today (or a future day you open) go straight onto that day's log, once each;
   delete one and it stays deleted. Past days are never back-filled. */
function syncPlanned(k){
  if(store==="none"||k<todayKey()) return false;
  const pw=S.plans[weekStart(k)]; if(!pw) return false;
  const v=daySlots(pw,k), d=S.days[k]||(S.days[k]={items:[],routineDone:false,planSeen:[]}); d.planSeen=d.planSeen||[];
  const seen=new Set(d.planSeen), items=dayItems(k).slice(); let changed=false;
  SLOTS.forEach(sl=>v[sl].filter(countsForMe).forEach(e=>{
    const key=sl+"|"+e.id; if(seen.has(key)) return; seen.add(key); changed=true;
    const f=plannable(e.id); if(!f) return; const meal=slotMeal(sl);
    if(e.id==="out"){items.push({id:uid(),meal,name:outName(e,sl),kcal:+e.kcal||0,planned:true});return}
    if(e.id==="quick"){const it={id:uid(),meal,name:e.name||"Meal",kcal:+e.kcal||0,planned:true};if(e.protein!=null)it.protein=+e.protein;items.push(it);return}
    if(items.some(i=>i.foodId===e.id&&i.meal===meal)) return;   /* already there (e.g. from your routine) */
    const m=multOf(e), pf=foodProt(allFoods().find(x=>x.id===e.id)), sw=entrySwaps(e);
    const it={id:uid(),meal,name:f.name+(sw.kcal?" (with swaps)":""),foodId:f.id,amount:m>1?(packOf(f)?"whole pack":m):1,unit:m>1&&packOf(f)?"":(f.itemName&&!recipeById(f.id)?f.itemName:"portion"),kcal:Math.round(((f.kcal||0)+sw.kcal)*m),planned:true};
    if(pf!=null) it.protein=Math.round((pf+sw.protein)*m*10)/10;

    (e.extras||[]).forEach(x=>{const xf=exFood(x);if(!xf||x.shopOnly)return;items.push({id:uid(),meal,name:xf.name,foodId:xf.id,amount:+x.amount,unit:x.unit==="item"?(xf.itemName||"item")+(+x.amount!==1?"s":""):x.unitName,kcal:Math.round(exKcal(x)),protein:Math.round(exProt(x)*10)/10,planned:true})});}));
  if(!changed) return false;

}
function applyRoutine(k){
  if(store==="none"||k<todayKey()) return false;           /* never back-fill past days */
  const d=S.days[k]; if(d&&d.routineDone) return false;
  if(!routineDay(k)) return false;
  const byId=Object.fromEntries(allFoods().map(f=>[f.id,f]));
  /* if this week is planned, the plan's choice for each routine slot wins (so a swap made in Plan carries through) */
  const pw=S.plans[weekStart(k)], v=pw?daySlots(pw,k):null;
  const picks=[];
  routine().items.forEach(x=>{const sl=itemSlot(x);
    if(v&&v[sl]&&v[sl].filter(countsForMe).length) v[sl].filter(countsForMe).forEach(e=>picks.push({meal:slotMeal(sl),foodId:e.id,amount:1}));
    else picks.push({meal:x.meal,foodId:x.foodId,amount:+x.amount||1});});
  const seen=new Set();
  const add=picks.filter(x=>{const key=x.meal+x.foodId;if(seen.has(key))return false;seen.add(key);return true}).map(x=>{const f=byId[x.foodId];if(!f)return null;const a=x.amount;

  S.days[k]={...(S.days[k]||{}),items:dayItems(k).concat(add),routineDone:true}; saveDay(k); return true;
}

/* rank foods for a meal: what you've logged at that meal before, your meal presets for that slot, and tonight's planned recipe */
const SLOT={"meal-usual-breakfast":"Breakfast","aldi-336884":"Breakfast","meal-usual-lunch":"Lunch","aldi-strawberry-pouch":"Snacks","meal-double-shake":"Snacks","impact-whey-choc-brownie":"Snacks"};
function suggestFor(meal){
  const all=allFoods(), byId=Object.fromEntries(all.map(f=>[f.id,f])), score={}, amt={};
  const cutoff=shift(todayKey(),-60);
  Object.keys(S.days).filter(d=>d>=cutoff).sort().forEach(d=>dayItems(d).forEach(i=>{
    if(!i.foodId||!byId[i.foodId]) return;
    score[i.foodId]=(score[i.foodId]||0)+(i.meal===meal?3:0.2);
    if(i.meal===meal) amt[i.foodId]=i.amount;
  }));
  all.forEach(f=>{const slot=f.slot||SLOT[f.id];if(slot===meal&&!isDb(f))score[f.id]=(score[f.id]||0)+5});
  S.recipes.forEach(r=>{if(r.slot===meal&&byId[r.id])score[r.id]=(score[r.id]||0)+1.5});
  if(meal==="Tea"){const pw=S.plans[weekStart(curDate)];if(pw)daySlots(pw,curDate).Tea.forEach(e=>{if(byId[e.id])score[e.id]=(score[e.id]||0)+20});}
  const taken=new Set(dayItems(curDate).map(i=>i.foodId));
  return Object.keys(score).filter(id=>score[id]>=1&&!(taken.has(id)&&byId[id].basis==="item"&&isMeal(byId[id]))).sort((a,b)=>score[b]-score[a]).slice(0,8)
    .map(id=>{const f=byId[id];return {f,amt:amt[id]??(f.basis==="item"?1:"")}});
}
/* the last things you had at this meal (newest first, one of each), so you can add one again in a tap */
const isCereal=f=>/flake|cereal|bran|granola|muesli|weetabix|wheat bisk|shredded|oat|porridge|cheerio|crunch|krispies|crisp rice|choco rice|fruit & fibre/i.test(f.name)&&f.basis==="100g";
const milkFood=()=>foodsAll().find(x=>x.basis==="100ml"&&/milk/i.test(x.name)&&!/coconut/i.test(x.name));
function recentFor(meal){const out=[],seen=new Set();
  const byId=Object.fromEntries(allFoods().map(f=>[f.id,f]));
  Object.keys(S.days).sort().reverse().forEach(d=>{const its=dayItems(d);its.slice().reverse().forEach((i,ri)=>{if((i.meal||"Snacks")!==meal||out.length>=8)return;
    const idx=its.length-1-ri, prev=its[idx-1], next=its[idx+1], f=byId[i.foodId];
    if(/milk/i.test(i.name||"")&&i.unit==="ml"&&prev&&prev.meal===i.meal&&byId[prev.foodId]&&isCereal(byId[prev.foodId]))return;   /* milk that went with a cereal shows on the cereal row */
    const milk=f&&isCereal(f)&&next&&next.meal===i.meal&&/milk/i.test(next.name||"")&&next.unit==="ml"?+next.amount:0;
    const k=(i.foodId||"")+"|"+(i.name||"").toLowerCase()+"|"+(f&&f.basis!=="item"&&!f.components?"":(i.amount??""));if(seen.has(k))return;seen.add(k);out.push({...i,_day:d,_milk:milk})})});
  return out}
function recentRows(meal){const tk=todayKey();return recentFor(meal).map((i,n)=>`<button type="button" class="item" data-rec="${n}"><span class="name">${esc(i.name)}<br><span class="amt">${[i.amount!==undefined&&i.amount!==""?esc(i.amount)+" "+esc(i.unit||"")+(i._milk?` + ${i._milk}ml milk`:""):"",i._day===tk?"today":i._day===shift(tk,-1)?"yesterday":esc(keyToDate(i._day).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}))].filter(Boolean).join(" · ")}</span></span><span class="num" style="text-align:right">${fmt(i.kcal)}<br><span class="muted" style="font-size:.75rem;font-family:inherit">${weighed(i)?"choose amount":"+ add"}</span></span></button>`).join("")}
const weighed=i=>{const f=i.foodId&&allFoods().find(x=>x.id===i.foodId);return !!(f&&f.basis!=="item"&&!f.components)};
function guessMeal(){const h=new Date().getHours();return h<11?"Breakfast":h<15?"Lunch":h<17?"Snacks":"Tea"}

function planSummary(){
  const w=weekStart(todayKey()),p=planOf(w);
  return weekDays(w).map((d,i)=>{const v=daySlots(p,d);const parts=SLOTS.map(sl=>v[sl].filter(countsForMe).length?sl+": "+v[sl].filter(countsForMe).map(e=>{const r=plannable(e.id);return r?`${r.name}${e.left?" (leftovers)":""} (${r.kcal} kcal)`:""}).join(", "):"").filter(Boolean);return parts.length?`- ${DOW[i]} ${d}: `+parts.join("; "):""}).filter(Boolean).join("\n")||"(nothing planned)";
}
async function ask(){
  const q=$("#question").value.trim(); if(!q||!sample||asking) return;
  asking=true; lastAnswer=""; render(); $("#question").value=q;
  const k=todayKey(), t=S.settings.target;
  const foods=S.foods.map(f=>`- ${f.name}${f.shop?" ("+f.shop+")":""}: ${f.kcal} kcal per ${f.basis==="item"?(f.itemName||"item"):f.basis==="100ml"?"100 ml":"100 g"}`).join("\n")||"(none saved yet)";
  const log=dayItems(k).map(i=>`- ${i.meal}: ${i.name}${i.amount?" "+i.amount+" "+(i.unit||""):""} = ${i.kcal} kcal`).join("\n")||"(nothing logged yet)";
  const prompt=`You are the calculator inside a personal calorie log. Today is ${niceDate(k)}.
Daily target: ${t?t+" kcal":"not set"}. Eaten so far today: ${fmt(eaten(k))} kcal. Remaining: ${t?fmt(t-eaten(k))+" kcal":"unknown"}.

Saved foods (label values, use these exactly):
${foods}

Today's log:
${log}

This week's planned meals (from the app's planner, kcal per portion):
${planSummary()}

Weekly food plan notes (pasted from the user's notes, may be blank):
${S.plan.slice(0,4000)||"(none)"}

Question: ${q}

Answer for a phone screen in plain English, short. When asked how much of a food fits, give the amount in grams, ml or items, rounded DOWN to a sensible number, and show the one-line sum (e.g. "450 kcal ÷ 3.6 kcal per g = 125 g"). Use only the saved foods' values; if a food isn't saved, say so and give a typical UK supermarket estimate clearly labelled as an estimate. Don't lecture about diet.`;
  try{
    const r=await sample(prompt,{cache:false,onText:({text})=>{lastAnswer=text;const a=$("#answer");if(a)a.textContent=text}});
    lastAnswer=r.text;
  }catch(e){lastAnswer=e&&e.code==="not_granted"?"Asking Claude needs your permission. Tap Ask again and allow it.":e&&e.code==="rate_limited"?"Too many questions in a row. Wait a minute and try again.":"Something went wrong asking Claude. Try again.";}
  asking=false; const keep=q; render(); const qa=$("#question"); if(qa) qa.value=keep;
}

  else if(act==="viewplanned"){recipeById(a.dataset.id)?recipeSheet(a.dataset.id,a.dataset.day,a.dataset.idx,a.dataset.slot):plannedMealSheet(a.dataset.id,a.dataset.day,a.dataset.slot,+a.dataset.idx)}
  else if(act==="wprev"){planWeek=shift(planWeek,-7);render()}
  else if(act==="wnext"){planWeek=shift(planWeek,7);render()}
  else if(act==="planadd") planPicker(a.dataset.day,a.dataset.slot);
  else if(act==="planout") outSheet(a.dataset.day,a.dataset.slot,null,"both");
  else if(act==="viewrecipe"){recipeSheet(a.dataset.id,a.dataset.day,a.dataset.idx);
    if(/Method/.test(a.textContent))setTimeout(()=>{const h=document.getElementById("methodhead");if(h)h.scrollIntoView({block:"start"})},60)}
  else if(act==="addreg"){const v=($("#extra")||{}).value||"";regSheet(null,v.trim())}
  else if(act==="editreg") regSheet(a.dataset.id);
  else if(act==="skipreg"){const st=shopState(),r=st.regulars.find(x=>x.id===a.dataset.id);if(!r)return;const old={last:r.last,got:r.got};r.last=todayKey();r.got=false;saveShop();render();
    toast(`Skipped ${r.text} this time`,()=>{r.last=old.last;r.got=old.got;saveShop();render()})}
  else if(act==="delextra"){e.preventDefault();const st=shopState();st.extras=st.extras.filter(x=>x.id!==a.dataset.id);saveShop();render()}
  else if(act==="cleargot") clearBasket();
  else if(act==="copyshop") copyShop();
  else if(act==="saveplan"){S.plan=$("#plan").value;save("plan",{text:S.plan});toast("Plan saved")}
});
document.addEventListener("input",e=>{
  const id=e.target.id; if(id!=="foodsearch"&&id!=="recipesearch") return;
  if(id==="foodsearch") foodQuery=e.target.value; else recipeQuery=e.target.value;
  const pos=e.target.selectionStart;render();const s=$("#"+id);s.focus();s.setSelectionRange(pos,pos)});
document.addEventListener("change",e=>{
  const a=e.target; if(!a.dataset||!a.dataset.act) return;
  const k=a.dataset.key, st=shopState();
  if(a.dataset.act==="got"){const inB=a.dataset.in==="b";
    if(k.startsWith("x:")){const x=st.extras.find(y=>"x:"+y.id===k);if(x)x.got=!inB}
    else if(k.startsWith("r:")){const r=st.regulars.find(y=>"r:"+y.id===k);if(r)r.got=!inB}
    else{const it=findShop(k,inB);if(it)it.keys.forEach(kk=>{if(inB)delete st.got[kk];else st.got[kk]=1})}
    saveShop();render()}
  else if(a.dataset.act==="need"){const w=a.dataset.w,p=planOf(w);p.need[a.dataset.rk]=a.checked;if(a.checked)delete st.done[a.dataset.k];else delete st.got[a.dataset.k];savePlan(w);saveShop();
    if(a.dataset.n){const pan=pantry();a.checked?pan.delete(a.dataset.n):pan.add(a.dataset.n);S.settings={...S.settings,pantry:[...pan]};save("settings",S.settings)}
    render()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("earlier"))showEarlier=d.open;if(d.classList&&d.classList.contains("filters"))recFiltersOpen=d.open;if(d.classList&&d.classList.contains("pickfd")){if(pickFOpen!==d.open){pickFOpen=d.open;if(pickRedraw)pickRedraw()}}if(d.classList&&d.classList.contains("needall"))shopMealsOpen=d.open;if(d.classList&&d.classList.contains("earlierdays"))planPastOpen=d.open;
  if(d.classList&&d.classList.contains("planday")){const k=d.dataset.pd;if(k===todayKey()){d.open?planOpen.delete("!"+k):planOpen.add("!"+k)}else{d.open?planOpen.add(k):planOpen.delete(k)}}if(d.classList&&d.classList.contains("ingsall"))ingsOpen=d.open;if(d.classList&&d.classList.contains("need")){d.open?openShop.add(d.dataset.rid):openShop.delete(d.dataset.rid)}},true);
/* ---------- quick add: type it, log it or put it on the shopping list ---------- */
const MEALWORD={breakfast:"Breakfast",brekkie:"Breakfast",lunch:"Lunch",tea:"Tea",dinner:"Tea",supper:"Tea",snack:"Snacks",snacks:"Snacks"};
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?"Breakfast":h<14.5?"Lunch":h<17?"Snacks":"Tea"}
const splitList=t=>t.split(/\s*(?:,|;|\n)\s*/).map(x=>x.trim()).filter(Boolean);
function quickShop(text){const parts=splitList(text.replace(/\b(add|to|on|the|my)?\s*(shopping\s*list|shopping|list)\b/gi,""));
  if(!parts.length){toast("Type what you need first");$("#qa")&&$("#qa").focus();return}
  const st=shopState();parts.forEach(t=>st.extras.push({id:uid(),text:t.charAt(0).toUpperCase()+t.slice(1),got:false}));saveShop();
  const q=$("#qa");if(q)q.value="";toast(`Added to shopping: ${parts.join(", ")}`)}
function quickLog(text){let meal=null;
  const raw=text.replace(/\b(for|at|to|my|add|log)\b/gi," ");
  const parts=splitList(raw);if(!parts.length){toast("Type what you ate first");return}
  const done=[],ask=[];
  parts.forEach(p=>{let t=" "+p.toLowerCase()+" ";
    Object.keys(MEALWORD).forEach(w=>{const re=new RegExp("\\s"+w+"\\s","i");if(re.test(t)){meal=MEALWORD[w];t=t.replace(re," ")}});
    let n=null,u="";const m=t.match(/^\s*(\d+(?:\.\d+)?|a|an|one|two|three|four|half)\s*(g|grams?|ml|kg|l)?\b/i);
    if(m){const w={a:1,an:1,one:1,two:2,three:3,four:4,half:.5}[m[1].toLowerCase()];n=w!=null?w:+m[1];u=(m[2]||"").toLowerCase().replace(/^grams?$/,"g");if(u==="kg"){n*=1000;u="g"}if(u==="l"){n*=1000;u="ml"}t=t.slice(m[0].length)}
    const q=t.replace(/\bof\b/g," ").replace(/\s+/g," ").trim();if(!q)return;
    const hit=searchFoods(q).find(x=>!x.quick&&x.f.kind!=="recipe");const f=hit&&hit.f;
    if(!f){ask.push(q);return}
    let amt=null,unit="";
    if(f.basis==="item"){amt=u&&(u==="g"||u==="ml")&&+f.g?n/f.g:(n||1);unit=f.itemName||"item"}
    else{if(u==="g"||u==="ml")amt=n;else if(+f.itemG)amt=(n||1)*f.itemG;else{ask.push(q);return}unit=f.basis==="100ml"?"ml":"g"}
    done.push({f,amt,unit,shown:f.basis==="item"?fmt(amt):fmt(amt)})});
  const k=todayKey(),its=dayItems(k).slice(),M=meal||mealNow(),added=[];
  done.forEach(({f,amt,unit})=>{const it={id:uid(),meal:M,name:f.name,foodId:f.id,amount:Math.round(amt*100)/100,unit,kcal:Math.round(kcalFor(f,amt))};const pr=protFor(f,amt);if(pr!=null)it.protein=Math.round(pr*10)/10;its.push(it);added.push(it)});
  if(added.length){S.days[k]={...(S.days[k]||{}),items:its};saveDay(k);curDate=k;render();
    toast(`${M}: ${added.map(i=>`${i.name.replace(/ \(.*\)$/,"")} ${fmt(i.kcal)}`).join(", ")} kcal`,()=>{const ids=new Set(added.map(i=>i.id));S.days[k]={...(S.days[k]||{}),items:dayItems(k).filter(i=>!ids.has(i.id))};saveDay(k);render()})}
  if(ask.length){/* couldn't work it out: open the normal add screen with the words filled in */
    setTimeout(()=>{itemSheet(null,M);const fq=$("#foodq");if(fq){fq.value=ask[0];fq.dispatchEvent(new Event("input",{bubbles:true}))}
      if(ask.length>1||!added.length)toast(`Check the amount for: ${ask.join(", ")}`)},added.length?900:0)}
  const q=$("#qa");if(q&&!ask.length)q.value=""}
document.addEventListener("change",e=>{if(e.target.id==="impfile"&&e.target.files[0])importFile(e.target.files[0])});
document.addEventListener("submit",e=>{if(e.target.id!=="qaform")return;e.preventDefault();quickLog($("#qa").value)});
function addAdj(n,note){n=Math.round(+n||0);if(!n){toast("Type a number, e.g. -80 or 120");return}
  const k=curDate,its=dayItems(k).slice();its.push({id:uid(),meal:ADJ,name:note||(n<0?"Took off":"Added extra"),kcal:n,protein:0,amount:"",unit:""});
  S.days[k]={...(S.days[k]||{}),items:its};saveDay(k);render();toast(`${n>0?"+":"−"}${fmt(Math.abs(n))} kcal`)}
document.addEventListener("submit",e=>{if(e.target.id!=="adjform")return;e.preventDefault();addAdj($("#adjn").value,$("#adjnote").value.trim())});
document.addEventListener("submit",e=>{if(e.target.id!=="extraform")return;e.preventDefault();const v=$("#extra").value.trim();if(!v)return;const st=shopState();st.extras.push({id:uid(),text:v,got:false});saveShop();render();const x=$("#extra");if(x)x.focus()});
async function copyShop(){
  const {left}=shopList();
  const text="Shopping list\n"+SECTIONS.map(sec=>{const its=left.filter(i=>i.sec===sec);return its.length?`\n${sec}\n`+its.map(i=>"- "+i.name+(i.qty?" — "+i.qty:"")).join("\n"):""}).join("");
  try{await navigator.clipboard.writeText(text);toast("List copied")}catch(err){toast("Couldn't copy. Press and hold the list to select it.")}
}

let toastTimer;
/* swipe a logged food left to delete it (with undo) */
function deleteLogged(id){const k=curDate,items=dayItems(k),i=items.findIndex(x=>x.id===id);if(i<0)return;const gone=items[i];
  S.days[k]={...(S.days[k]||{}),items:items.filter(x=>x.id!==id)};saveDay(k);render();
  toast(`Deleted ${gone.name}`,()=>{const its=dayItems(k).slice();its.splice(i,0,gone);S.days[k]={...(S.days[k]||{}),items:its};saveDay(k);render();});}
(()=>{let sx=0,sy=0,el=null,dx=0,mode=null;
  document.addEventListener("touchstart",e=>{const b=e.target.closest&&e.target.closest('.swipewrap>.item[data-act="edit"]');if(!b){el=null;return}
    el=b;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=null;el.style.transition="none"},{passive:true});
  const unswipe=b=>setTimeout(()=>{if(b.parentNode)b.parentNode.classList.remove("swiping")},220);
  document.addEventListener("touchmove",e=>{if(!el)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(!mode)mode=Math.abs(x)>8&&Math.abs(x)>Math.abs(y)?"h":Math.abs(y)>8?"v":null;if(mode!=="h")return;
    dx=Math.min(0,x);el.parentNode.classList.add("swiping");el.style.transform=`translateX(${dx}px)`},{passive:true});
  document.addEventListener("touchend",()=>{if(!el)return;const b=el;el=null;b.style.transition="";
    if(mode==="h"){swipeBlock=Date.now();if(dx<-Math.min(110,b.offsetWidth*.35)){b.style.transform="translateX(-100%)";setTimeout(()=>deleteLogged(b.dataset.id),180)}else{b.style.transform="";unswipe(b)}}else unswipe(b)});
})();
let swipeBlock=0;
/* the week's planned meals as plain text, to paste into a message or notes. Empty days stay blank. */
function weekText(wk){const p=planOf(wk),tk=wk;
  const nm=(e,s)=>{let n=isSimple(e.id)?(e.name||outName(e,s)):((plannable(e.id)||{}).name||"").replace(/ \([^)]*\d[^)]*\)$/,"");
    const w=whoOf(e);if(w==="me")n+=" (me)";else if(w==="wife")n+=` (${partnerName()})`;return n};
  const first=keyToDate(wk),last=keyToDate(shift(wk,6));
  const head=`Meal plan: ${first.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${last.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`;
  const lines=[head,""];
  for(let i=0;i<7;i++){const d=shift(wk,i),v=daySlots(p,d);
    lines.push(keyToDate(d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}));
    ["Lunch","Tea"].filter(s=>v[s]).forEach(s=>{const n=v[s].map(e=>nm(e,s)).filter(Boolean);if(n.length)lines.push(`  ${s}: ${n.join(", ")}`)});
    lines.push("")}
  return lines.join("\n").trim()}
async function copyWeek(){const t=weekText(planWeek);let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){try{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e){}}
  if(ok){toast("Week copied – paste it anywhere");return}
  /* copying blocked: show the text so it can be selected by hand */
  openSheet(`<div class="row"><h2 class="grow">This week's meals</h2><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
    <p class="muted" style="margin:0">Press and hold in the box, then Select All and Copy.</p>
    <textarea id="wktext" readonly style="width:100%;min-height:340px;font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px">${esc(t)}</textarea>`,
    sh=>{const ta=sh.querySelector("#wktext");ta.focus();ta.select()})}
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button">Undo</button>':""}`;
  if(undo)t.querySelector("button").onclick=()=>{undo();t.remove()};
  document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),undo?6000:2500);
}
/* keep dates true to the calendar if the app is left open past midnight */
let lastToday=todayKey();
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;const t=todayKey();if(t===lastToday)return;
  if(curDate===lastToday)curDate=t; if(planWeek===weekStart(lastToday))planWeek=weekStart(t); lastToday=t; if(!$("#overlay .sheet"))render()});
boot();
})();
</script>
